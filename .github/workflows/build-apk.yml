name: Build Snake APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testy logiki Snake
        run: python -m unittest -v test_snake
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build APK using official Kivy Buildozer Docker image
        run: |
          docker run --rm \
            --volume "$PWD":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest android debug
      - name: Verify APK exists
        run: |
          ls -lah bin/
          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: snake-apk
          path: bin/*.apk
          if-no-files-found: error
